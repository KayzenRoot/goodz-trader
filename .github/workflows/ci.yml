name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: |
            packages/core/coverage/lcov.info
            packages/mexc/coverage/lcov.info
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            **/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: goodz-trader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          secret=$(openssl rand -hex 32)
          docker run -d --name goodz-ci -p 3001:3001 \
            -e NODE_ENV=production \
            -e APP_SECRET="$secret" \
            -e AUTH_PASSWORD=ci-password-123 \
            -e DATABASE_PATH=/data/goodz.db \
            -e WEB_DIST_PATH=/app/apps/web/dist \
            -e SEED_DEMO=false \
            goodz-trader:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/api/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health/ready
          test "$(docker exec goodz-ci id -u)" = "1000"
          docker stop goodz-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' goodz-ci)" = "0"

      - name: Container logs
        if: failure()
        run: docker logs goodz-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f goodz-ci || true

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.20.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @goodz/web exec playwright install --with-deps --only-shell chromium

      - name: Playwright
        run: pnpm --filter @goodz/web e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [quality, docker, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required checks
        run: |
          echo "Quality: ${{ needs.quality.result }}"
          echo "Docker:  ${{ needs.docker.result }}"
          echo "E2E:     ${{ needs.e2e.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.docker.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::Quality Gate failed. Inspect Quality/Docker/E2E jobs."
            exit 1
          fi
          echo "Quality Gate passed."
