name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: |
            packages/core/coverage/lcov.info
            packages/mexc/coverage/lcov.info
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            **/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: goodz-trader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          secret=$(openssl rand -hex 32)
          docker run -d --name goodz-ci -p 3001:3001 \
            -e NODE_ENV=production \
            -e APP_SECRET="$secret" \
            -e AUTH_PASSWORD=ci-password-123 \
            -e DATABASE_PATH=/data/goodz.db \
            -e WEB_DIST_PATH=/app/apps/web/dist \
            -e SEED_DEMO=false \
            goodz-trader:ci
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/api/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/health/ready
          test "$(docker exec goodz-ci id -u)" = "1000"
          docker stop goodz-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' goodz-ci)" = "0"

      - name: Container logs
        if: failure()
        run: docker logs goodz-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f goodz-ci || true

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @goodz/web exec playwright install --with-deps --only-shell chromium

      - name: Playwright
        run: pnpm --filter @goodz/web e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality Gate
    if: always()
    needs: [quality, docker, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required checks
        run: |
          echo "Quality: ${{ needs.quality.result }}"
          echo "Docker:  ${{ needs.docker.result }}"
          echo "E2E:     ${{ needs.e2e.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.docker.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::Quality Gate failed. Inspect Quality/Docker/E2E jobs."
            exit 1
          fi
          echo "Quality Gate passed."
