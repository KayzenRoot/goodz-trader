name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The marketplace action pulls a GCR image; the CLI is used so the audit
      # does not depend on that registry being available.
      - name: Install Scorecard CLI
        run: |
          curl -sSfL https://github.com/ossf/scorecard/releases/download/v5.6.0/scorecard_5.6.0_linux_amd64.tar.gz | tar -xz
          sudo install -m 0755 scorecard /usr/local/bin/scorecard

      - name: Run Scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scorecard --repo="github.com/${{ github.repository }}" \
            --show-details --format json --output results.json

      - name: Summarize
        run: node scripts/ci/scorecard-summary.mjs results.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.json
          retention-days: 7
