services:
  goodz:
    build:
      context: .
      dockerfile: Dockerfile
    image: goodz-trader:local
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:3001:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /data/goodz.db
      WEB_DIST_PATH: /app/apps/web/dist
      SEED_DEMO: 'false'
      MAINTENANCE_ENABLED: 'true'
      RETENTION_LOGS_DAYS: '14'
      RETENTION_EQUITY_DAYS: '90'
      RETENTION_AUDIT_DAYS: '365'
    volumes:
      - goodz-data:/data
      - ./backups:/backups
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  goodz-data:
