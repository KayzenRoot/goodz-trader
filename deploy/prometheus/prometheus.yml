global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: goodz-trader
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/goodz-metrics-token
    static_configs:
      - targets: ['goodz:3001']
        labels:
          instance: goodz-trader
